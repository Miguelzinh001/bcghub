<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCG Hub</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --primary: #2ecc71; --text: #ffffff; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #000; }
    nav a, nav button { color: var(--text); margin-left: 15px; text-decoration: none; background: none; border: none; cursor: pointer; font-size: 16px; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
    .announcement { background: #27ae60; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 20px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: var(--card); border-radius: 8px; overflow: hidden; cursor: pointer; }
    .card img { width: 100%; height: 130px; object-fit: cover; }
    .card-content { padding: 10px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; position: relative; }
    .close { position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 20px; }
    input, button, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; box-sizing: border-box; }
    button.btn-main { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; }
    #chat-box { height: 250px; overflow-y: auto; background: #111; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    .chat-msg { margin-bottom: 8px; font-size: 14px; }
    .chat-msg strong { color: var(--primary); }
    video { width: 100%; border-radius: 5px; }
  </style>
</head>
<body>

  <header>
    <h2>BCG Hub</h2>
    <nav>
      <a href="#" onclick="showSection('episodes-sec')">Episódios</a>
      <a href="#" onclick="showSection('chat-sec')">Chat & Amigos</a>
      <a href="#" onclick="showSection('profile-sec')" id="profile-link" style="display:none;">Perfil</a>
      <button id="admin-btn" style="display:none; color: #f1c40f;" onclick="openModal('admin-modal')">Admin Panel</button>
      <button id="auth-btn" onclick="openModal('auth-modal')">Login</button>
    </nav>
  </header>

  <div class="container">
    <div id="global-announcement" class="announcement" style="display:none;"></div>

    <!-- Secção Episódios -->
    <section id="episodes-sec">
      <h3>Episódios</h3>
      <div id="episodes-grid" class="grid"></div>
    </section>

    <!-- Secção Chat & Amigos -->
    <section id="chat-sec" style="display:none;">
      <h3>Chat da Comunidade</h3>
      <div id="chat-box"></div>
      <form id="chat-form" onsubmit="sendChatMessage(event)">
        <input type="text" id="chat-input" placeholder="Escreve uma mensagem..." required>
        <button type="submit" class="btn-main">Enviar</button>
      </form>
    </section>

    <!-- Secção Perfil -->
    <section id="profile-sec" style="display:none;">
      <h3>O teu Perfil</h3>
      <div style="background: var(--card); padding: 20px; border-radius: 8px;">
        <p><strong>Nome de utilizador:</strong> <span id="prof-username"></span></p>
        <p><strong>Status:</strong> <span id="prof-status">Membro</span></p>
      </div>
    </section>
  </div>

  <!-- Modal Video Player -->
  <div id="player-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('player-modal')">&times;</span>
      <h3 id="player-title"></h3>
      <video id="video-player" controls src=""></video>
    </div>
  </div>

  <!-- Modal Auth -->
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('auth-modal')">&times;</span>
      <h3>Entrar no BCG Hub</h3>
      <input type="text" id="auth-username" placeholder="Username">
      <input type="password" id="auth-password" placeholder="Password">
      <button class="btn-main" onclick="handleAuth()">Entrar</button>
    </div>
  </div>

  <!-- Modal Admin -->
  <div id="admin-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('admin-modal')">&times;</span>
      <h3>Admin Panel</h3>
      
      <h4>Atualizar Anúncio Global</h4>
      <input type="text" id="ann-text" placeholder="Texto do anúncio">
      <button class="btn-main" onclick="updateAnnouncement()">Publicar Anúncio</button>

      <hr style="margin: 20px 0; border-color: #333;">

      <h4>Adicionar Episódio</h4>
      <form onsubmit="handleEpisodeSubmit(event)">
        <input type="text" id="ep-title" placeholder="Título do Episódio" required>
        <input type="text" id="ep-tag" placeholder="Tag (ex: S01 E01)" required>
        <input type="url" id="ep-thumb" placeholder="URL da Thumbnail (Opcional)">
        <label style="font-size: 12px;">Escolher ficheiro MP4 do dispositivo:</label>
        <input type="file" id="ep-file" accept="video/mp4">
        <p style="text-align: center; margin: 5px 0; font-size: 12px;">OU</p>
        <input type="url" id="ep-url" placeholder="Link direto do vídeo (ex: Catbox/Archive)">
        <button type="submit" class="btn-main">Publicar Episódio</button>
      </form>
    </div>
  </div>

  <script>
    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "bcg-hub-1a904.firebaseapp.com",
      projectId: "bcg-hub-1a904",
      storageBucket: "bcg-hub-1a904.appspot.com",
      messagingSenderId: "...",
      appId: "..."
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = localStorage.getItem('bcg_user') || null;

    // Navegação
    function showSection(id) {
      document.querySelectorAll('section').forEach(s => s.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { 
      document.getElementById(id).style.display = 'none'; 
      if(id === 'player-modal') document.getElementById('video-player').pause();
    }

    // Autenticação simples
    function updateUI() {
      if (currentUser) {
        document.getElementById('auth-btn').innerText = 'Sair (' + currentUser + ')';
        document.getElementById('auth-btn').onclick = logout;
        document.getElementById('profile-link').style.display = 'inline';
        document.getElementById('prof-username').innerText = currentUser;
        
        if (currentUser === 'miguel') {
          document.getElementById('admin-btn').style.display = 'inline';
          document.getElementById('prof-status').innerText = 'Administrador';
        }
      } else {
        document.getElementById('auth-btn').innerText = 'Login';
        document.getElementById('auth-btn').onclick = () => openModal('auth-modal');
        document.getElementById('admin-btn').style.display = 'none';
        document.getElementById('profile-link').style.display = 'none';
      }
    }

    function handleAuth() {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();

      if (u === 'miguel' && p === 'cricketgreen') {
        currentUser = 'miguel';
      } else if (u) {
        currentUser = u;
      } else {
        alert('Preenche o username!');
        return;
      }
      localStorage.setItem('bcg_user', currentUser);
      closeModal('auth-modal');
      updateUI();
    }

    function logout() {
      localStorage.removeItem('bcg_user');
      currentUser = null;
      updateUI();
    }

    // Anúncios
    db.collection('settings').doc('announcement').onSnapshot(doc => {
      if (doc.exists && doc.data().text) {
        const el = document.getElementById('global-announcement');
        el.innerText = doc.data().text;
        el.style.display = 'block';
      }
    });

    async function updateAnnouncement() {
      const text = document.getElementById('ann-text').value;
      await db.collection('settings').doc('announcement').set({ text: text });
      alert('Anúncio atualizado!');
      closeModal('admin-modal');
    }

    // Carregar Episódios
    db.collection('episodes').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      const grid = document.getElementById('episodes-grid');
      grid.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        grid.innerHTML += `
          <div class="card" onclick="playVideo('${data.title}', '${data.videoUrl}')">
            <img src="${data.thumbnail || 'https://picsum.photos/500/300'}" alt="Thumb">
            <div class="card-content">
              <strong>${data.tag}</strong>
              <p style="margin: 5px 0 0 0;">${data.title}</p>
            </div>
          </div>
        `;
      });
    });

    function playVideo(title, url) {
      document.getElementById('player-title').innerText = title;
      const player = document.getElementById('video-player');
      player.src = url;
      openModal('player-modal');
      player.play();
    }

    // Upload direto via Catbox.moe
    async function handleEpisodeSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('ep-title').value;
      const tag = document.getElementById('ep-tag').value;
      const thumbUrl = document.getElementById('ep-thumb').value;
      const fileInput = document.getElementById('ep-file');
      const directUrl = document.getElementById('ep-url').value;

      let finalUrl = directUrl;

      if (fileInput.files.length > 0) {
        alert("A fazer upload do MP4... Por favor aguarda!");
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', fileInput.files[0]);

        try {
          const res = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: formData });
          if (res.ok) {
            finalUrl = await res.text();
          } else {
            alert("Erro no upload do ficheiro.");
            return;
          }
        } catch (err) {
          alert("Falha na ligação ao servidor de upload.");
          return;
        }
      }

      if (!finalUrl) {
        alert("Insere um ficheiro ou um link direto!");
        return;
      }

      await db.collection('episodes').add({
        title: title,
        tag: tag,
        thumbnail: thumbUrl,
        videoUrl: finalUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert("Episódio publicado!");
      closeModal('admin-modal');
    }

    // Chat da Comunidade em Tempo Real
    db.collection('chat').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      snapshot.forEach(doc => {
        const d = doc.data();
        box.innerHTML += `<div class="chat-msg"><strong>${d.user}:</strong> ${d.text}</div>`;
      });
      box.scrollTop = box.scrollHeight;
    });

    async function sendChatMessage(e) {
      e.preventDefault();
      if (!currentUser) {
        alert("Faz login para poderes conversar no chat!");
        openModal('auth-modal');
        return;
      }
      const input = document.getElementById('chat-input');
      if (!input.value.trim()) return;

      await db.collection('chat').add({
        user: currentUser,
        text: input.value.trim(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      input.value = '';
    }

    updateUI();
  </script>
</body>
</html>
